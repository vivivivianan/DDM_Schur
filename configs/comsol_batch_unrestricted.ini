# Local COMSOL batch launcher configuration. It leaves the installation untouched
# and disables Java sandboxing only for locally authored, reviewed batch classes.
batch
-startup
..\..\plugins\org.eclipse.equinox.launcher_1.6.200.v20210416-2027.jar
--launcher.library
..\win64
-install ../..
-vm
..\..\java\win64\jre\bin\server\jvm.dll
-vmargs
-Dosgi.clean=true
-Dorg.osgi.service.log.admin.loglevel=DEBUG
-Dosgi.locking=none
-Dosgi.configuration.cascaded=true
-Dosgi.sharedConfiguration.area=file:configuration/comsol
-Dosgi.sharedConfiguration.area.readOnly=true
-Dosgi.configuration.area=@user.home/.comsol/v61/configuration/comsol_@process.id
-Dosgi.instance.area=@user.home/.comsol/v61/workspace/comsol_@process.id
-Dosgi.checkConfiguration=true
-Declipse.security=
-Djava.security.manager=
-Dcs.javasecurity=off
-Dcs.logoutput=file
-Dcs.logfileprefix=batch
-Dcs.uniqueworkspace=on
-Xss4m
-Xms40m
-Xmx2g
-XX:MaxMetaspaceSize=1g
-Dlog4j2.formatMsgNoLookups=true
